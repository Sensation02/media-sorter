name: "CI"

on:
  push:
    branches: [main, staging, production]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, staging, production]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  RUST_TOOLCHAIN: "stable"
  CARGO_TERM_COLOR: "always"

jobs:
  ui-quality:
    name: UI — lint & test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check / Build
        run: pnpm build

      - name: Test
        run: pnpm test
        if: ${{ hashFiles('src/**/*.test.*', 'src/**/*.spec.*') != '' }}

  rust-quality:
    name: Rust — fmt, clippy, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Tauri runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-features

  build-matrix:
    name: Build — ${{ matrix.os }}
    needs: [ui-quality, rust-quality]
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Build Tauri app (no signing)
        shell: bash
        run: pnpm tauri build --ci --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Write build summary
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo "### Build — $RUNNER_OS"
            echo ""
            echo "- Unsigned smoke build succeeded on \`$RUNNER_OS\`."
            echo "- Commit: \`$COMMIT_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  comment-status:
    name: Comment build status on merged PR
    needs: [build-matrix]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment build status on the merged PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh api "repos/$REPOSITORY/commits/$COMMIT_SHA/pulls" --jq '.[0].number // empty' || true)
          if [ -z "$PR_NUMBER" ]; then
            echo "No associated PR for $COMMIT_SHA; skipping comment."
            exit 0
          fi
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" \
            --body "CI build passed on macOS, Ubuntu, and Windows for merge commit \`$COMMIT_SHA\`."
