name: "Security Audit"

# Dependency vulnerability gate — docs/workflow/dependency-policy.md.
# JS: any high or critical advisory fails. Rust: any RustSec vulnerability fails;
# unmaintained / unsound warnings are reported, not gated.
# Only package names and versions from the lockfiles reach the advisory databases.

on:
    pull_request:
        branches: [staging, production]
        paths:
            - "package.json"
            - "pnpm-lock.yaml"
            - "src-tauri/Cargo.toml"
            - "src-tauri/Cargo.lock"
            - ".github/workflows/security-audit.yml"
    push:
        branches: [staging, production]
        paths:
            - "package.json"
            - "pnpm-lock.yaml"
            - "src-tauri/Cargo.toml"
            - "src-tauri/Cargo.lock"
            - ".github/workflows/security-audit.yml"
    schedule:
        - cron: "0 6 * * 1"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: security-audit-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: "22"

jobs:
    js-audit:
        name: Audit — pnpm (high+)
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}

            - name: pnpm audit
              run: pnpm audit --audit-level high

    rust-audit:
        name: Audit — cargo (RustSec)
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: src-tauri
        steps:
            - uses: actions/checkout@v4

            - name: Install cargo-audit
              uses: taiki-e/install-action@v2
              with:
                  tool: cargo-audit

            - name: cargo audit
              run: cargo audit
